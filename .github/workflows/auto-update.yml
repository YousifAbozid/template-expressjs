name: 🔄 Auto Dependency Updater

on:
  schedule:
    - cron: '0 3 * * *' # every day at 3AM UTC (adjust as needed)
  workflow_dispatch: # allow manual trigger from Actions tab

permissions:
  contents: write
  pull-requests: write

jobs:
  update-dependencies:
    runs-on: ubuntu-latest

    steps:
      - name: 📥 Checkout code
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: 🟢 Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20 # or your project's version
          cache: 'npm'

      - name: 📦 Upgrade dependencies
        id: upgrade
        run: |
          npm install -g npm-check-updates

          # Get current dependency versions for the commit message
          echo "DEPENDENCY_UPDATES<<EOF" >> $GITHUB_ENV
          ncu --format json | jq -r '.dependencies + .devDependencies | to_entries | .[] | "\(.key): \(.value.from) -> \(.value.to)"' >> $GITHUB_ENV
          echo "EOF" >> $GITHUB_ENV

          # Update dependencies (separate major from minor updates)
          ncu -u --target minor # First do safe updates (minor/patch)
          npm install

          # Run tests to make sure nothing breaks with the updates
          npm test

          # Check if there are changes to commit
          if [ -n "$(git status --porcelain)" ]; then
            echo "CHANGES_MADE=true" >> $GITHUB_ENV
          else
            echo "CHANGES_MADE=false" >> $GITHUB_ENV
          fi

      - name: 🔍 Run security audit
        run: npm audit --json || true

      - name: 🔄 Create Pull Request for minor/patch updates
        if: env.CHANGES_MADE == 'true'
        uses: peter-evans/create-pull-request@v5
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          commit-message: 'chore: 🔄 update dependencies (minor/patch)'
          title: '📦 Dependency Updates (Minor/Patch)'
          body: |
            This PR updates project dependencies to their latest minor/patch versions.

            ## Updates

            ```
            ${{ env.DEPENDENCY_UPDATES }}
            ```

            *Auto-generated by the Dependency Updater workflow*
          branch: dependency-updates-minor
          base: ${{ github.ref_name }}
          labels: dependencies, automated pr

      # Optional: Run a separate job for major updates that might contain breaking changes
      - name: 🔄 Check for major updates
        if: success()
        run: |
          # Reset any changes
          git reset --hard
          git clean -fd

          # Check for major updates only
          ncu --target major --filter "/.*/" --format json > major-updates.json
          if [ "$(cat major-updates.json | jq 'length')" -gt "0" ]; then
            echo "MAJOR_UPDATES=true" >> $GITHUB_ENV
            ncu -u --target major
            npm install
            # Don't run tests here as major updates might break things
          else
            echo "MAJOR_UPDATES=false" >> $GITHUB_ENV
          fi

      - name: 🔄 Create Pull Request for major updates
        if: env.MAJOR_UPDATES == 'true'
        uses: peter-evans/create-pull-request@v5
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          commit-message: 'chore: 🔄 update dependencies (major version updates)'
          title: '⚠️ Dependency Updates (Major Versions) - BREAKING CHANGES POSSIBLE'
          body: |
            This PR includes **major version updates** that might contain breaking changes.
            Please review carefully before merging.

            *Auto-generated by the Dependency Updater workflow*
          branch: dependency-updates-major
          base: ${{ github.ref_name }}
          labels: dependencies, breaking change, automated pr
